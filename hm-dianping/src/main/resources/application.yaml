server:
  port: 8081 #网页本机端口
  shutdown: graceful # 设置优雅关闭超时时间

spring:
  profiles:
    include: sensitive
  main:
    log-startup-info: false  # 关闭启动日志
    banner-mode: off
  application:
    name: hmdp
  datasource: #mysql数据库
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:}
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
        # 设置Redis连接池优雅关闭
        max-wait: -1ms
        # 设置Redis连接池优雅关闭
      shutdown-timeout: 10000ms
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  lifecycle:
    timeout-per-shutdown-phase: 30s # 设置优雅关闭超时时间
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  global-config:
    banner: false  # 关闭MyBatis Plus的banner
logging:
  level:
    root: WARN # 全局日志级别设为ERROR，过滤INFO/WARN日志
    org.springframework: WARN  # Spring框架日志
    org.springframework.boot: ERROR  # Spring Boot核心日志
    com.hmdp: debug